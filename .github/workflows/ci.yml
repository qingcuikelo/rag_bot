name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint / Type / Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy

      - name: Unit tests
        run: pytest -q -m "not integration"

  integration:
    name: Integration / Eval (needs secrets)
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ github.event_name == 'push' }}
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      EMBED_MODEL: ${{ secrets.EMBED_MODEL }}
      RERANK_MODEL: ${{ secrets.RERANK_MODEL }}
      AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Skip if no API key
        id: gate
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build index
        if: steps.gate.outputs.run == 'true'
        run: python scripts/build_index.py

      - name: Retrieval eval gate
        if: steps.gate.outputs.run == 'true'
        run: python scripts/run_eval.py --mode hybrid --split dev --k 5 --gate 0.80

      - name: Integration tests
        if: steps.gate.outputs.run == 'true'
        run: pytest -q -m "integration"
